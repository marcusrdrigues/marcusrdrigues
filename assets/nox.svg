<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -14 240 248" width="160" height="165" role="img" aria-labelledby="t">
  <title id="t">Nox, o mascote de marcusrdrigues.com</title>
  <style>
    .breathe { animation: breathe 4.6s ease-in-out infinite; transform-origin: 100px 210px; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 6.2s ease-in-out infinite; }
    .scan { animation: scan 5s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.012); } }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
    @keyframes scan { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-7px, 1px); } 55% { transform: translate(6px, -2px); } 75% { transform: translate(2px, 4px); } }
    @media (prefers-reduced-motion: reduce) { .breathe, .blink, .scan { animation: none; } }
  </style>
  <rect x="-20" y="-14" width="240" height="248" rx="36" fill="#0a0a0f"/>
  <g class="breathe">
    <path d="M62 150 H 138 L 162 204 H 38 Z" fill="#1b1b26" stroke="#f2f2f5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 150 L 100 204 M62 150 L 80 204 M138 150 L 120 204" fill="none" stroke="#f2f2f5" stroke-width="2" opacity=".35"/>
    <path d="M84 204 V214 M74 214 H94 M116 204 V214 M106 214 H126" fill="none" stroke="#f2f2f5" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 30 L 100 6 L 110 30 Z" fill="#1b1b26" stroke="#f2f2f5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 28 L 150 52 L 158 102 L 130 148 L 70 148 L 42 102 L 50 52 Z" fill="#1b1b26" stroke="#f2f2f5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 28 L 100 72 M150 52 L 124 72 M50 52 L 76 72 M158 102 L 124 120 M42 102 L 76 120 M130 148 L 112 124 M70 148 L 88 124" fill="none" stroke="#f2f2f5" stroke-width="2" opacity=".35"/>
    <g class="blink">
      <circle cx="100" cy="96" r="26" fill="#0a0a0f" stroke="#f2f2f5" stroke-width="4"/>
      <circle cx="100" cy="96" r="17" fill="none" stroke="#c9a227" stroke-width="4"/>
      <circle class="scan" cx="100" cy="96" r="6" fill="#c9a227"/>
    </g>
    <path d="M100 126 L 90 134 L 100 148 L 110 134 Z" fill="#8e8ea3" stroke="#f2f2f5" stroke-width="3" stroke-linejoin="round"/>
